<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>{% block title %}MBTA Stop Finder{% endblock %}</title>

  <!-- Mapbox GL JS -->
  <link href="https://api.mapbox.com/mapbox-gl-js/v3.3.0/mapbox-gl.css" rel="stylesheet" />
  <script src="https://api.mapbox.com/mapbox-gl-js/v3.3.0/mapbox-gl.js"></script>

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;700;800&family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;1,9..40,300&display=swap" rel="stylesheet" />

  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}" />
</head>
<body>

  <header class="site-header">
    <a href="/" class="logo">
      <span class="logo-t">T</span>
      <span class="logo-text">Finder</span>
    </a>
    <p class="tagline">Boston's nearest MBTA stop, instantly.</p>
  </header>

  <main class="main-content">
    {% block content %}{% endblock %}
  </main>

  <footer class="site-footer">
    Powered by <a href="https://www.mapbox.com/" target="_blank">Mapbox</a>
    &amp; <a href="https://www.mbta.com/developers/v3-api" target="_blank">MBTA API</a>
  </footer>

</body>
</html>
